services:
  redis: 
    image: redis:7

    container_name: redis-container

    restart: unless-stopped

    networks:
      - tourist-network

    ports:
      - "6379:6379"

  backend:
    build:
      context: ./backend-service
    
    image: tourist-backend

    container_name: tourist-backend-container

    restart: unless-stopped

    networks:
      - tourist-network

    ports: 
      - "8000:8000"
    
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379

    volumes:
      - ./backend-service:/app
      - ./shared:/app/shared:ro

    command: >
      uvicorn main:app
      --host 0.0.0.0
      --port 8000
      --reload

    depends_on:
      - redis

  frontend:
    build:
      context: ./frontend

    image: tourist-frontend

    container_name: tourist-frontend-container

    restart: unless-stopped

    networks:
      - tourist-network

    ports:
      - "5173:5173"
    
    volumes:
      - ./frontend:/app
      - /app/node_modules

    depends_on:
      - backend

networks:
  tourist-network:
