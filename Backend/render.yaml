services:
  - type: web
    name: smart-safety-tour-api
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: DB_HOST
        value: your-db-host
      - key: DB_PORT
        value: 5432
      - key: DB_NAME
        value: smart_safety_tour
      - key: DB_USER
        value: postgres
      - key: DB_PASSWORD
        generateValue: true
