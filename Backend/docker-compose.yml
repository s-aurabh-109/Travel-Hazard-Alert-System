services:
  app:
    build: .
    container_name: smart-safety-tour-app
    ports:
      - "5001:5000"
    environment:
      NODE_ENV: development
      PORT: 5000
      JWT_SECRET: dev-secret
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: smart_safety_tour
      DB_USER: postgres
      DB_PASSWORD: postgres
    depends_on:
      - postgres
    volumes:
      - .:/app
      - /app/node_modules

  postgres:
    image: postgres:16-alpine
    container_name: smart-safety-tour-postgres
    environment:
      POSTGRES_DB: smart_safety_tour
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_safety_tour"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
